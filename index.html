<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Whiteboard Login</title>
<style>
  body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f0f0; }
  .card { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); width: 300px; text-align: center; }
  input { width: 100%; padding: 8px; margin: 6px 0 14px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
  button { width: 100%; padding: 10px; background: #4a90e2; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
  button:hover { background: #3a7bc8; }
  .error { color: #d33; font-size: 14px; margin-top: 10px; }
  .whiteboard { width: 100%; height: 400px; border: 1px solid #ccc; margin-top: 16px; background: #fff; }
  h2 { margin-top: 0; }
</style>
</head>
<body>
  <div class="card" id="loginCard">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Username (admin or student)" autocomplete="username">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <button onclick="doLogin()">Login</button>
    <div class="error" id="error"></div>
  </div>

  <div class="card" id="confirmCard" style="display:none;">
    <h2 id="confirmTitle">Confirmation</h2>
    <p id="confirmText"></p>
    <button onclick="showWhiteboard()">Continue to Whiteboard</button>
  </div>

  <div class="card" id="whiteboardCard" style="display:none;">
    <h2>Whiteboard</h2>
    <canvas id="whiteboard" class="whiteboard"></canvas>
  </div>

<script>
  const TEACHER = { username: 'admin', password: 'admin', role: 'Teacher' };
  const STUDENT = { username: 'student', password: 'student', role: 'Student' };

  function doLogin() {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    const err = document.getElementById('error');
    err.textContent = '';
    let user = null;
    if (u === TEACHER.username && p === TEACHER.password) user = TEACHER;
    else if (u === STUDENT.username && p === STUDENT.password) user = STUDENT;
    if (!user) {
      err.textContent = 'Invalid username or password';
      return;
    }
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('confirmTitle').textContent = 'Login Successful';
    document.getElementById('confirmText').textContent = `Welcome, ${user.role}. You are logged in.`;
    document.getElementById('confirmCard').style.display = 'block';
  }

  function showWhiteboard() {
    document.getElementById('confirmCard').style.display = 'none';
    document.getElementById('whiteboardCard').style.display = 'block';
    initWhiteboard();
  }

  function initWhiteboard() {
    const canvas = document.getElementById('whiteboard');
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    let drawing = false;
    let lastX = 0, lastY = 0;

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches ? e.touches[0] : e;
      return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
    }

    function start(e) {
      drawing = true;
      const p = getPos(e);
      lastX = p.x; lastY = p.y;
      e.preventDefault();
    }
    function move(e) {
      if (!drawing) return;
      const p = getPos(e);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 3;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      lastX = p.x; lastY = p.y;
      e.preventDefault();
    }
    function stop() { drawing = false; }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', stop);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', stop);
  }
</script>
</body>
</html>
